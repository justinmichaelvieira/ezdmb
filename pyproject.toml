[project]
name = "ezdmb"
version = "1.0.5"
description = "A dead-simple digital menu board display and configuration."
readme = "README.md"
authors = [
    { name = "Justin Vieira", email = "justin@rancorsoft.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aqtinstall>=3.3.0",
    "pyinstaller>=6.22.2",
    "pyqt-distutils>=0.7.3",
    "pyside6>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.78",
]
