name: Publish

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        #   - os: ubuntu-latest
        #     artifact_name: ezdmb.dpkg
        #     asset_name: ezdmb-dpkg-amd64
          - os: windows-latest
            artifact_name: ezdmb_x64.exe
            asset_name: ezdmb_x64.exe

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --locked
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: windows/windows_install/docker/${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        tag: ${{ github.ref }}
